name: Public Testing

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: choice
        options:
          - '21'
          - '25'
        default: '21'
      browser:
        description: Which browser to use
        required: true
        type: choice
        options:
          - 'chrome'
          - 'firefox'
        default: 'firefox'

  workflow_call:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: string
        default: '21'
      browser:
        description: Which browser to use
        required: true
        type: string
        default: 'firefox'

jobs:
  public:
    name: Public_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivesspace
          MYSQL_USER: as
          MYSQL_PASSWORD: as123
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      solr:
        image: solr:9.11.0
        env:
          SOLR_MODULES: analysis-extras
        ports:
          - 8984:8983

    steps:
    - uses: browser-actions/setup-geckodriver@latest
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - run: geckodriver --version
    - run: firefox --version
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version || 21  }} # https://github.com/actions/runner/issues/2372
        distribution: temurin

    - uses: './.github/actions/bootstrap'
      with:
        backend: true
        public: true
        indexer: true

    - name: Create ArchivesSpace Solr core
      uses: ./.github/actions/create-solr-core
      with:
        solr_container_id: ${{ job.services.solr.id }}

    - name: Run Public tests
      run: |
        ./build/run public:test
      env:
        SELENIUM_CHROME: ${{ inputs.browser == 'chrome' }}
        ARCHIVESSPACE_VERSION: ${{ github.ref }}
        RSPEC_RETRIES: 2

    - name: Upload the ci logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failed_spec_saved_pages(public)_Java_${{ inputs.java-version || 21 }}
        path: ci_logs/*

    - name: Post Coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        format: simplecov
        compare-ref: ${{ github.event.repository.default_branch }}
        flag-name: public
        debug: false
        parallel: true
