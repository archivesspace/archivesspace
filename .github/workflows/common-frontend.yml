name: Frontend Testing Sub-Workflow
permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      run-cmd:
        required: true
        type: string
      name:
        required: true
        type: string
      java-version:
        required: true
        type: string
        default: '17'
      browser:
        description: Which browser to use
        required: true
        type: string
        default: 'firefox'
      timings-artifact:
        description: When set, records the run time of each spec file and uploads it as an artifact with this name
        required: false
        type: string
        default: ''
      coverage:
        description: Whether to post coverage to Coveralls
        required: false
        type: boolean
        default: true

jobs:
  frontend:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivesspace
          MYSQL_USER: as
          MYSQL_PASSWORD: as123
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=9s --health-retries=10
      solr:
        image: solr:9.4.1
        env:
          SOLR_MODULES: analysis-extras
        ports:
          - 8984:8983

    steps:
    - uses: browser-actions/setup-geckodriver@latest
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - run: geckodriver --version
    - run: firefox --version
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version || 17 }}
        distribution: temurin

    - uses: './.github/actions/bootstrap'
      with:
        backend: true
        frontend: true
        indexer: true

    - name: Allow ArchivesSpace functions for app db user
      env:
        DB_PORT: "3307"
      run: |
        mysql --host 127.0.0.1 --port $DB_PORT -uroot -proot -e 'SET GLOBAL log_bin_trust_function_creators = 1;'

    - name: Copy solr config from workspace to solr service
      env:
        SOLR_ID: ${{ job.services.solr.id }}
      run: |
        docker cp solr $SOLR_ID:/solr_conf_from_repo

    - name: Create ArchivesSpace Solr core
      env:
        SOLR_ID: ${{ job.services.solr.id }}
      run: |
        docker exec --tty $SOLR_ID solr create_core -p 8983 -c archivesspace -d /solr_conf_from_repo

    - name: Setup firefox
      id: setup-firefox
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: 'latest'

    - name: Run Frontend tests
      run: ${{ inputs.run-cmd }}
      env:
        SELENIUM_CHROME: ${{ inputs.browser == 'chrome' }}
        ARCHIVESSPACE_VERSION: ${{ github.ref }}
        # Formatters given in SPEC_OPTS replace the ones on the rspec command line, so keep documentation output too
        SPEC_OPTS: ${{ inputs.timings-artifact && format('--require {0}/build/scripts/frontend_feature_shards/file_timing_formatter.rb --format documentation --format FileTimingFormatter --out {0}/feature_timings.jsonl', github.workspace) || '' }}

    - uses: actions/upload-artifact@v6
      if: ${{ always() && inputs.timings-artifact }}
      with:
        name: ${{ inputs.timings-artifact }}
        path: feature_timings.jsonl
        if-no-files-found: ignore
        retention-days: 7

    - uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: failed_spec_saved_pages(${{ inputs.name }})_Java_${{ inputs.java-version || 17 }}
        path: 'ci_logs'

    - name: Post Coverage to Coveralls
      if: ${{ inputs.coverage }}
      uses: coverallsapp/github-action@v2
      with:
        format: simplecov
        compare-ref: ${{ github.event.repository.default_branch }}
        flag-name: ${{ inputs.name }}
        debug: false
        parallel: true
