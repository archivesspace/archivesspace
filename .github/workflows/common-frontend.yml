name: Frontend Testing Sub-Workflow
permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      run-cmd:
        required: true
        type: string
      name:
        required: true
        type: string
      java-version:
        required: true
        type: string
        default: '21'
      browser:
        description: Which browser to use
        required: true
        type: string
        default: 'firefox'

jobs:
  frontend:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivesspace
          MYSQL_USER: as
          MYSQL_PASSWORD: as123
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=9s --health-retries=10
      solr:
        image: solr:9.11.0
        env:
          SOLR_MODULES: analysis-extras
        ports:
          - 8984:8983

    steps:
    - uses: browser-actions/setup-geckodriver@latest
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - run: geckodriver --version
    - run: firefox --version
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version || 21 }}
        distribution: temurin

    - uses: './.github/actions/bootstrap'
      with:
        backend: true
        frontend: true
        indexer: true

    - name: Allow ArchivesSpace functions for app db user
      env:
        DB_PORT: "3307"
      run: |
        mysql --host 127.0.0.1 --port $DB_PORT -uroot -proot -e 'SET GLOBAL log_bin_trust_function_creators = 1;'

    - name: Create ArchivesSpace Solr core
      uses: ./.github/actions/create-solr-core
      with:
        solr_container_id: ${{ job.services.solr.id }}

    - name: Setup firefox
      id: setup-firefox
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: 'latest'

    - name: Run Frontend tests
      run: ${{ inputs.run-cmd }}
      env:
        SELENIUM_CHROME: ${{ inputs.browser == 'chrome' }}
        ARCHIVESSPACE_VERSION: ${{ github.ref }}

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: failed_spec_saved_pages(${{ inputs.name }})_Java_${{ inputs.java-version || 21 }}
        path: 'ci_logs'

    - name: Post Coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        format: simplecov
        compare-ref: ${{ github.event.repository.default_branch }}
        flag-name: ${{ inputs.name }}
        debug: false
        parallel: true
