name: Code Scan
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: choice
        options:
          - '21'
          - '25'
        default: '21'

  workflow_call:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: string
        default: '21'

jobs:
  rubocop:
    name: Rubocop_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version || 21 }}
          distribution: temurin

      - name: Run rubocop
        run: |
          ./build/run rubocop

  eslint:
    name: ESLint_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint on front ends
        run: npm run eslint:ci

  stylelint:
    name: Stylelint_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run Stylelint on front ends
        run: npm run stylelint:ci

  prettier:
    name: Prettier_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier on front ends
        run: npm run prettier:ci

  herb:
    name: Herb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run Herb Linter
        run: npm run herb:ci
