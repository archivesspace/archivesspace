name: Backend Testing
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: choice
        options:
          - '21'
          - '25'
        default: '21'

  workflow_call:
    inputs:
      java-version:
        description: Java version to run specs on
        required: true
        type: string
        default: '21'

jobs:
  backend:
    name: Backend_Java_v${{ inputs.java-version || 21 }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: archivesspace
          MYSQL_USER: as
          MYSQL_PASSWORD: as123
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      solr:
        image: solr:9.11.0
        env:
          SOLR_MODULES: analysis-extras
        ports:
          - 8984:8983

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version || 21 }}
        distribution: temurin

    - uses: './.github/actions/bootstrap'
      with:
        backend: true
        indexer: true

    - name: Allow ArchivesSpace functions for app db user
      env:
        DB_PORT: "3307"
      run: |
        mysql --host 127.0.0.1 --port $DB_PORT -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

    - name: Create ArchivesSpace Solr core
      uses: ./.github/actions/create-solr-core
      with:
        solr_container_id: ${{ job.services.solr.id }}

    - name: Run Backend tests
      run: |
        ./build/run backend:test
      env:
        ARCHIVESSPACE_VERSION: ${{ github.ref }}

    - name: Post Coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        format: simplecov
        compare-ref: ${{ github.event.repository.default_branch }}
        flag-name: backend
        debug: false
        parallel: true
