  assessment_attribute:
    rating:
      Reformatting Readiness: 媒体変換の適性
      Reformatting Readiness_tooltip: "<p>資料をどの程度容易に再フォーマットできるかを示す、1から5の評価。</p>"
      Housing Quality: 収納の品質
      Housing Quality_tooltip: "<p>コレクション内の資料の収納全体の質を記述するための1から5までの評価。コレクション内のアイテムまたはマテリアルのグループは、全体的なレーティングよりも優れた、または劣悪な収納になる可能性があります。
        </p>"
      Physical Condition: 物理的状態
      Physical Condition_tooltip: "<p>コレクション内の資料の全体的な状態を表すための1から5までの評価。特に懸念される資料や資料群は、保存修復の注記に示します。</p>"
      Physical Access (arrangement): 物理的アクセス（編成）
      Physical Access (arrangement)_tooltip: "<p>コレクションの複雑さと規模を考慮した、コレクションの物理的な排列に対する1〜5の評価。例えば、大まかに排列された小規模で比較的均質なコレクションは、大まかに排列された大規模で異質なコレクションよりも、一般に物理的に利用しやすく、評価にもその点が反映されます。（多くのコレクションではアイテム単位までの排列は望ましくない場合があり、評価4がそのコレクションにとって望ましい最高の評価となることもあります。）</p>"
      Intellectual Access (description): 知的アクセス（記述）
      Intellectual Access (description)_tooltip: "<p>コレクションの知的記述に適用される1から5までの評価、およびその記述のユーザーへのアクセス可能性。
        </p>"
      Interest: 関心度
      Interest_tooltip: "<p>研究者、寄贈者、または地元の関心の高さを示す1から5の評価。「関心度」と「ドキュメントの品質」を合わせて「研究価値」のスコアになります。</p>"
      Documentation Quality: ドキュメントの品質
      Documentation Quality_tooltip: "<p>コレクションで利用できる文書の豊富さと深さに対する1から5の評価。「関心度」と「ドキュメントの品質」を合わせて「研究価値」のスコアになります。</p>"
      Documentation Quality_values_tooltip: "<ul><li><b>評価1</b>：わずか</li><li><b>評価2</b>：付随的に有用</li><li><b>評価3</b>：やや豊富</li><li><b>評価4</b>：豊富</li><li><b>評価5</b>：非常に豊富</li></ul>"
      Housing Quality_values_tooltip: "<ul><li> <b>評価1</b> ：アーカイブ用でない箱に収納され、棚に資料がばらのまま置かれていることもある。資料の大半がフォルダに入っておらず、箱が詰め込みすぎ、またはすかすかである。製本資料の場合、製本の状態が悪く、表紙板が欠けているか、本文の束を損なっている。
        </li><li> <b>評価2</b> ：アーカイブ用でない箱とフォルダに収納されている。かなりの数の箱やフォルダで、入っている資料の量が適切でないか、収納する資料に合ったサイズ・種類ではない。製本資料の場合、製本の状態はまずまずである（表紙板が外れていることがある）。
        </li><li> <b>評価3</b> ：アーカイブ用でない箱とフォルダに収納されているが、状態は良好。ほとんどの箱やフォルダに入っている資料の量は適切である。ほとんどの箱やフォルダは収納する資料に合ったサイズ・種類である。製本資料の場合、製本の状態は良好である（多少傷んでいるが損なわれてはいない）。
        </li><li> <b>評価4</b> ：一部が状態の良い中性紙の箱とフォルダに収納されている。ほとんどの箱やフォルダに入っている資料の量は適切である。ほとんどの箱やフォルダは収納する資料に合ったサイズ・種類である。製本資料の場合、製本の状態は非常に良好である（通常の使用による傷み程度）。
        </li><li> <b>評価5</b> ：全体が状態の良い中性紙の箱とフォルダに収納されている。箱やフォルダに入っている資料の量は適切である。箱やフォルダは収納する資料に合ったサイズ・種類である。製本資料の場合、製本の状態は極めて良好である。
        </li></ul>"
      Intellectual Access (description)_values_tooltip: "<ul><li> <b>評価1</b> ：研究者はコレクションにアクセスできない。寄贈者／管理ファイルや、簡略な、または利用できない受入レコードといった内部文書が、コレクションの唯一の記述となっている。こうした内部文書は量も質もさまざまだが、性質上、研究者は利用できない。
        </li><li> <b>評価2</b> ：研究者のアクセスは不十分である。コレクションには検索手段がないか、標準に満たない検索手段しかない。印刷された目録カードなどオフラインのコレクションレベルの記述はあるが、OPACや全国書誌ユーティリティにコレクションレベルのMARCレコードはない。あるいは、検索手段がないか標準に満たないが、OPACや全国書誌ユーティリティにMARCレコードはある。ただし、大規模または複雑なコレクションのため、それでは十分なアクセスを提供できない。どちらの場合も、研究者が利用できる他のオンライン・オフラインの情報源にコレクションが記述されていることはあるが、コレクションの複雑さや情報源の不備のため、アクセスは不十分である。
        </li><li> <b>評価3</b> ：研究者のアクセスはまずまずである。検索手段が標準に満たないか、検索手段がない。機関のOPACやOCLCなどの全国書誌ユーティリティに、コレクションレベルのMARCレコードがある。完全なMARCレコードがない場合は、別の形のオンラインのコレクションレベルの記述がある。小規模または単純なコレクションのため、研究者が利用できるオンライン・オフラインの情報源にあるコレクションレベルの記述で、十分なアクセスが得られる。
        </li><li> <b>評価4</b> ：研究者のアクセスは良好である。良い検索手段があるが、オンラインでは公開されていない。機関のOPACやOCLCなどの全国書誌ユーティリティに、コレクションレベルのMARCレコードがある。あるいは、オンラインまたはオフラインで良い検索手段があるが、機関のOPACやOCLCなどの全国書誌ユーティリティにコレクションレベルのMARCレコードはない。検索手段の質から、検索手段だけで良好なアクセスが得られる。どちらの場合も、研究者が利用できる他のオンライン・オフラインの情報源にコレクションが記述されていることもある。
        </li><li> <b>評価5</b> ：研究者のアクセスは非常に良好である。良いオンラインの検索手段（EAD、HTML、PDFなどの形式）がある。機関のOPACやOCLCなどの全国書誌ユーティリティに、コレクションレベルのMARCレコードがある。研究者が利用できる他のオンライン・オフラインの情報源（印刷版やオンライン版の所蔵案内など）にもコレクションが記述されていることがある。
        </li></ul>"
      Interest_values_tooltip: "<ul><li> <b>評価1</b> ：無視できる</li><li> <b>評価2</b> ：軽い</li><li> <b>評価3</b>
        ：中程度</li><li> <b>評価4</b> ：高</li><li> <b>評価5</b> ：非常に高い</li></ul>"
      Physical Access (arrangement)_values_tooltip: "<ul><li> <b>評価1</b> ：まったく未編成。多くの、ときには大半の文書が、まだ封筒から出されておらず、広げられず、平らにされていない。研究者はまったく利用できない。
        </li><li> <b>評価2</b> ：部分的または表面的な編成、標準的でない収納や表示のため、職員の特別な支援がなければ利用しにくい。 </li><li> <b>評価3</b> ：日付、文書の種類、機能、出所などの特性による大まかな編成。文書は十分に選別されていないが、広げて平らにされている。シリーズもファイルも十分に確立されていない。研究者は、目的の資料を見つけるために、関係のない大量の資料に目を通さなければならないことが多い。冊子体の資料は、複数の用途に使われていたり、資料が貼り込まれていたりして、やや乱雑なことがある。
        </li><li> <b>評価4</b> ：ファイルレベルまでシリーズに編成されている。ファイル内はおおむね整然としている。冊子体の資料は整然としている（例：アルファベット順の会計簿、主題順にきれいにまとめたスクラップブック）。
        </li><li> <b>評価5</b> ：シリーズと、必要に応じてサブシリーズの中で、アイテムレベルまで完全に編成されている。冊子体の資料は整然としており、索引がある（例：人名索引付きの年代順の会計記録）。
        </li></ul>"
      Physical Condition_values_tooltip: "<ul><li><b>評価1</b>：悪い：コレクションの利用を困難にする著しい損傷・劣化。</li><li><b>評価2</b>：まあまあ：予想よりやや悪い劣化があり、さらに劣化する可能性がある。</li><li><b>評価3</b>：良好：予想どおりの劣化があり、さらに劣化する可能性がある。</li><li><b>評価4</b>：非常に良い：損傷はほとんどないが、資料の品質が混在しているため、さらに劣化する可能性がある。</li><li><b>評価5</b>：優秀：資料の品質が高いため、損傷はほとんどなく、これ以上の劣化も予想されない。</li></ul>"
      Reformatting Readiness_values_tooltip: "<ul><li><b>評価1</b>：資料の再フォーマットは極めて困難です。深刻な保存上の問題がある、極めて古い形式である、または再フォーマットを制限する知的財産上の懸念がある可能性があります。メタデータが欠けているか不完全な可能性があります。</li><li><b>評価2</b>：資料の再フォーマットは困難です。保存上の問題がある、古い形式である、または知的財産上の懸念がある可能性があります。メタデータが欠けているか不完全な可能性があります。</li><li><b>評価3</b>：資料の再フォーマットはある程度容易です。いくらかの保存上の問題がある、古い形式である、または知的財産上の懸念がわずかにある可能性があります。メタデータがあるか、容易に作成できます。</li><li><b>評価4</b>：資料の再フォーマットは比較的容易です。保存上の問題は軽微で、形式は完全には廃れておらず、知的財産上の懸念もわずかです。メタデータがあります。</li><li><b>評価5</b>：資料は問題なく再フォーマットできます。保存上の問題はなく、形式は新しく、知的財産上の懸念もありません。メタデータがあり、完全です。</li></ul>"
      Documentation Quality_note_tooltip: 資料の文書化に関する詳細情報。
      Housing Quality_note_tooltip: コレクションの収納に関する特に懸念される領域を示します。
      Intellectual Access_note_tooltip: 資料への知的アクセスおよび資料の説明に関する詳細情報。
      Interest_note_tooltip: 資料の興味に関する詳細情報。
      Physical Access_note_tooltip: 材料への物理的アクセスおよび材料の配置に関する詳細。
      Physical Condition_note_tooltip: コレクションの物理的状態に関する特に懸念される領域を示します。
      Reformatting Readiness_note_tooltip: 潜在的なデジタル化やその他の資料の再フォーマットに関して懸念される分野を示します。
