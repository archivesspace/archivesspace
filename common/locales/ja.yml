    exhibition_value_note: 展示価値の注記
    exhibition_value_note_tooltip: "<p>コレクション自体、またはコレクション内で見つかった個々のアイテムが特に展示に適しているかどうかを示します。たとえば、このフィールドには、ユニークなアーティファクト、または歴史的意義の文字や写真が表示されます。
