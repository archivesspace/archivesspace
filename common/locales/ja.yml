    scope: 評価の範囲
    scope_tooltip: "<p>評価の範囲を示します。例：10％サンプリング。全体;コレクション内またはコレクション全体にわたる特定のフォーマットまたはジャンル。または評価中に積極的にレビューされた材料に関する他の制約または条件。
