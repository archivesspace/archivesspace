    id_0_tooltip: "<p>必須フィールド：リポジトリ内の受入の一意の識別子。 </p><p>ArchivesSpaceでは、受入識別子をその構成部分に解析するための4つのフィールドが用意されています。各セグメントは、50文字に制限されています。識別子の合計文字数は200文字です。少なくとも最初の部分は、有効な受入記録に使用する必要があります。
