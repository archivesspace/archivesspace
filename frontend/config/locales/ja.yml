# Google translate
ja:
  bulk_import_templates:
    aspace_accession_import_template_csv: 
      受入レコードに加えて、数量、外部文書、件名、エージェント、および最上位コンテナ付きのインスタンスを作成します。ダウンロードには、それぞれについて 
      _1 グループが 1 つ含まれます。既存の件名をリンクするには、subject_1_record_id に 197 のような数値 ID、または 
      /subjects/197 のような完全な URI を指定します。既存のエージェントも同じ方法で agent_1_record_id 
      を使ってリンクします。agent_1_agent_type は、数値 ID を指定する場合は必須で、/agents/people/5 のような 
      URI 
      を指定する場合は任意です。同じグループ内でリンク用の項目と作成用の項目の両方を入力しないでください。既存の最上位コンテナをリンクするには、/repositories/2/top_containers/5
      のような完全な URI 
      を指定するか、バーコードのみを指定します。バーコードのみを指定した場合は、そのバーコードを持つ最上位コンテナ（既存のものでも、前の行で作成されたものでも）がリンクされ、リポジトリ内にそのバーコードを持つ最上位コンテナが存在しない場合、インポートは失敗します。バーコードとともに他の最上位コンテナ項目を入力した場合は、代わりにそのバーコードを持つ新しい最上位コンテナが作成され、番号（インジケーター）が必須となります。そのバーコードがリポジトリ内ですでに使用されている場合、インポートは失敗します。
    overview: |
      <p>これらは、バックグラウンドジョブの画面にあるさまざまなインポート機能を使って、スプレッドシートのデータを ArchivesSpace に取り込むためのテンプレートです。インポートに必要なデータは、作成するレコードの種類によって異なります。すべての行と列を埋める必要はありません。</p><p>各 CSV テンプレートには、サンプルデータの行が 1 行入っています。サンプルデータでレコードを作成するつもりがなければ、スプレッドシートをアップロードする前にサンプルデータを削除してください。<b>見出しの行を削除したり、既存の列を並べ替えたりしないでください。</b>列を追加できるのは、番号付きのグループをまるごと複製して番号を変える場合だけです（例：extent_1_* の列をすべて extent_2_* や extent_12_* として複製する。番号は飛んでもかまいません）。それ以外の列は追加しないでください。未知の見出し、綴りの誤った見出し、廃止された見出しがあると、インポート全体が失敗します。</p><p>Excel のテンプレートには、テンプレートの使い方を説明する追加の指示と、一部のセルの入力チェックが含まれています。指示と入力チェックは削除しないでください。</p>
    aspace_digital_object_import_template_csv: 
      デジタルオブジェクトのレコードと、デジタルオブジェクトにリンクされるエージェント、件名、イベントなどのレコードを作成します。
    bulk_import_template_csv: 
      既存のリソースに属するアーカイバルオブジェクトを作成します。日付、数量、注記、コンテナ、デジタルオブジェクトなど、さまざまなサブレコードやリンクされたレコードを一緒に作成することもできます。CSV
      形式は、Microsoft Excel を使えない人向けです。
    bulk_import_template_xlsx: 
      既存のリソースに属するアーカイバルオブジェクトを作成します。日付、数量、注記、コンテナ、デジタルオブジェクトなど、さまざまなサブレコードやリンクされたレコードを一緒に作成することもできます。XLSX
      形式は、Microsoft Excel を使える人向けです。
    bulk_import_DO_template_csv: 
      リソース内の既存のアーカイバルオブジェクトに、デジタルオブジェクトを作成してリンクします。CSV 形式は、Microsoft Excel 
      を使えない人向けです。
    bulk_import_DO_template_xlsx: 
      リソース内の既存のアーカイバルオブジェクトに、デジタルオブジェクトを作成してリンクします。XLSX 形式は、Microsoft Excel 
      を使える人向けです。
    aspace_location_import_template_csv: 
      新しい所在のレコードを作成します。このテンプレートは所在のレコードそのものを作成するためのもので、資料を所在にリンクするためのものではありません。
    aspace_assessment_import_template_csv: 
      既存の受入、リソース、アーカイバルオブジェクト、デジタルオブジェクトに、評価を作成してリンクします。
    aspace_subject_import_template_csv: 
      新しい件名のレコードを作成します。このテンプレートは件名のレコードそのものを作成するためのもので、ほかのレコードにリンクするためのものではありません。
